<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Russian Study</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="analytics.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Russian Study <span>français → русский</span></h1>
      <nav class="tabs" aria-label="Sections">
        <button type="button" class="tab active" data-view="review" data-i18n="tab.review">Révision</button>
        <button type="button" class="tab" data-view="vocabulary" data-i18n="tab.vocabulary">Vocabulaire</button>
        <button type="button" class="tab" data-view="stats" data-i18n="tab.stats">Statistiques</button>
        <button type="button" class="tab" data-view="settings" data-i18n="tab.settings">Réglages</button>
      </nav>
      <button type="button" class="btn primary add-word" id="add-word"><span aria-hidden="true">+</span> <span data-i18n="vocab.add">Ajouter un mot</span></button>
      <div class="lang-switch" role="group" aria-label="Language / Langue">
        <button type="button" class="lang-btn active" data-lang="fr" lang="fr">FR</button>
        <button type="button" class="lang-btn" data-lang="en" lang="en">EN</button>
      </div>
      <span class="save-indicator" id="save-indicator" aria-live="polite"></span>
    </header>
    <main id="app" aria-live="polite"></main>
    <div id="modal-root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
